# Nginx 配置 - 独立日记
# 反向代理到 API (4319)，提供静态文件，带 Basic Auth 登录认证

server {
    listen 80;
    server_name _;

    # 登录认证（创建密码文件: sudo htpasswd -c /etc/nginx/.diary_htpasswd 用户名）
    auth_basic "独立日记";
    auth_basic_user_file /etc/nginx/.diary_htpasswd;

    # 上传大小限制
    client_max_body_size 10m;

    # 前端静态文件
    root /home/hongcheng/diary/apps/web/dist;
    index index.html;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:4319;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
